<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon_io\android-chrome-192x192.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div id="main">
        <section class="allElems">
            <header>
                <div class="header1">
                    <h1></h1>
                    <h4></h4>
                </div>
                <div class="header2">
                        <h2>20°C</h2>
                        <h3>Humidity: 51%</h3>
                        <h3>Precipitation: 0%</h3>
                        <h3>Wind: 6 km/h</h3>
                        <h4> Partly sunny</h4>
                    </div>
            </header>

            <div class="allFeatures">
                <div class="todo elem" id="0">
                    <img src="https://plus.unsplash.com/premium_photo-1672312039942-edce7c8eb764?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8M2QlMjBiYWNrZ3JvdW5kfGVufDB8fDB8fHww"
                        alt="">
                    <h2>To Do List</h2>
                </div>
                <div class="daily elem" id="1">
                    <img src="https://images.unsplash.com/photo-1642615835477-d303d7dc9ee9?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjB8fDNkfGVufDB8fDB8fHww"
                        alt="">
                    <h2>Daily Planner</h2>
                </div>
                <div class="moti elem" id="2">
                    <img src="https://images.unsplash.com/photo-1682846133858-c0599bc99874?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fDNkfGVufDB8fDB8fHww"
                        alt="">
                    <h2>Motivation</h2>
                </div>
                <div class="pomo elem" id="3">
                    <img src="https://images.unsplash.com/photo-1601315488950-3b5047998b38?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8M2R8ZW58MHx8MHx8fDA%3D"
                        alt="">
                    <h2>Pomodoro Timer</h2>
                </div>
                <div class="goals elem" id="4">
                    <img src="https://plus.unsplash.com/premium_photo-1704518704021-8a195b821d5c?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8M2R8ZW58MHx8MHx8fDA%3D"
                        alt="">
                    <h2>Daily Goals</h2>
                </div>
            </div>
        </section>
        <section class="fullElem todo-list-fullpage">
            <button class="back">Close</button>
            <h2>Your Personalized Task List</h2>
            <div class="todo-container">
                <div class="addTask">
                    <form>
                        <input required id="task-input" type="text" placeholder="Enter Task">
                        <textarea required placeholder="Enter Details" name="" id="" cols="30" rows="10"></textarea>
                        <div class="mark-imp">
                            <input type="checkbox" name="checkbox" id="check">
                            <label for="check">Mark as Important !</label>
                        </div>
                        <button>Add Task</button>
                    </form>
                </div>
                <div class="allTask"></div>
            </div>
        </section>
        <section class="fullElem daily-planner-fullpage">
            <button class="back">Close</button>
            <h2>Plan Your Day to be more Productive</h2>
            <div class="day-planner">

            </div>
        </section>
        <section class="fullElem motivational-fullpage">
            <button class="back">Close</button>
            <div class="motivationFull-page">
                <div class="motivation-container">
                    <div class="motivation-wrapper">
                        <img src="icons8-quote.png" alt="">
                        <div class="motivation-1">
                            <h2>Qoute of the Day</h2>
                        </div>
                        <div class="motivation-2">
                            <h1>
                                <h1>
                        </div>
                        <div class="motivation-3">
                            <h2></h2>
                        </div>

                    </div>

                </div>
            </div>

        </section>
        <section class="fullElem pomodoro-fullpage">
            <button class="back">Close</button>
            <h2>Study with me !</h2>
            <h4 class="session">Work Session</h4>
            <div class="pomo-timer">
                <h1>25:00</h1>
                <button class="start-timer">Start</button>
                <button class="pause-timer">Pause</button>
                <button class="reset-timer">Reset</button>
            </div>
        </section>
        <section class="fullElem daily-goal-fullpage">
            <button class="back">Close</button>
            <h1>Daily Goal</h1>
        </section>
    </div>
    <script src="script.js"></script>
</body>

</html>
